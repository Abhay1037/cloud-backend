version: '3.8'

services:
  backend-api:
    image: abhaypratap04/cloud-node-backend:latest
    container_name: node-api-container
    ports:
      - "5000:5000"
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://cache-db:6379
    depends_on:
      - cache-db

  cache-db:
    image: redis:alpine
    container_name: redis-cache-container
    restart: always
    volumes:
      - redis-data:/data

volumes:
  redis-data:
