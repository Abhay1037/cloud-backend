services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy-container
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api

  backend-api:
    image: abhaypratap04/cloud-node-backend:latest
    container_name: node-api-container
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://cache-db:6379
    depends_on:
      - cache-db

  cache-db:
    image: redis:alpine
    container_name: redis-cache-container
    restart: always
    volumes:
      - redis-data:/data

volumes:
  redis-data:
