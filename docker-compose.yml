services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy-container
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend-api

  backend-api:
    image: abhaypratap04/cloud-node-backend:latest
    container_name: node-api-container
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://cache-db:6379
    depends_on:
      - cache-db

  cache-db:
    image: redis:alpine
    container_name: redis-cache-container
    restart: always
    volumes:
      - redis-data:/data

  certbot:
    image: certbot/certbot
    container_name: certbot-container
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-container
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-container
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
