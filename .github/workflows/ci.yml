name: Continuous Integration - Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: GitHub Runner par code checkout karo
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Docker Buildx setup karo (Advanced caching aur fast builds ke liye)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Docker Hub par securely login karo
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Image Build aur Push karo
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-node-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-node-backend:v2
